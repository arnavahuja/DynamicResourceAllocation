server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend URL is injected at container start; defaults to localhost for
    # docker-compose. Cloud Run sets BACKEND_URL to the backend service URL.
    # We use sub_filter at runtime in the entrypoint, OR rely on the frontend
    # using same-origin /api which the load balancer routes. Simplest path:
    # both services live behind one ingress and /api is forwarded.

    location = /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived asset caching for hashed bundles
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
